<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title> Typing Practice</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: Arial, sans-serif; height: 100vh; display: flex; flex-direction: column; background: #eef2f5; }
    
    .top-bar { background: #1a5b8c; color: white; padding: 8px 15px; display: flex; justify-content: space-between; align-items: center; font-size: 0.9rem; }
    .top-bar h1 { font-size: 1.1rem; }
    .sub-bar { background: #3b82f6; color: white; padding: 5px 15px; font-size: 0.85rem; font-weight: bold; }
    
    .main-container { display: flex; flex: 1; padding: 10px; gap: 10px; overflow: hidden; }
    .box { flex: 1; display: flex; flex-direction: column; background: white; border: 1px solid #aaa; border-radius: 4px; padding: 10px; }
    
    /* Styled Editor Area with Paragraph Support */
    textarea { 
      flex: 1; 
      width: 100%; 
      border: 1px solid #ccc; 
      border-radius: 2px; 
      padding: 12px; 
      font-size: 1rem; 
      font-family: 'Times New Roman', Times, serif; 
      line-height: 1.6; 
      resize: none; 
      outline: none; 
      text-align: justify; 
      white-space: pre-wrap; 
      word-wrap: break-word; 
    }
    
    .footer-bar { background: #d9e2ec; padding: 8px 15px; display: flex; justify-content: space-between; align-items: center; }
    .btn { padding: 6px 16px; border: none; border-radius: 4px; font-weight: bold; cursor: pointer; color: white; }
    .btn-cancel { background: #dc3545; }
    .btn-submit { background: #0066cc; }
    
    /* Results View Matching Target Interface */
    .results-screen { display: none; flex-direction: column; padding: 15px; flex: 1; overflow-y: auto; background: #f8f9fa; }
    .results-container { display: flex; gap: 15px; margin-top: 15px; }
    .result-card { flex: 1; border-radius: 8px; overflow: hidden; background: white; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
    .card-header-user { background: #8062e1; color: white; padding: 10px; text-align: center; font-weight: bold; font-size: 1rem; }
    .card-header-orig { background: #318ce7; color: white; padding: 10px; text-align: center; font-weight: bold; font-size: 1rem; }
    
    .card-body { 
      padding: 15px; 
      font-family: 'Times New Roman', Times, serif; 
      font-size: 1rem; 
      line-height: 1.9; 
      text-align: justify; 
      white-space: pre-wrap; 
    }

    /* Word Highlight Badges */
    .correct { background-color: #d1ecf1; color: #0c5460; padding: 2px 4px; border-radius: 3px; display: inline-block; margin: 2px 1px; }
    .wrong { background-color: #f8d7da; color: #721c24; padding: 2px 4px; border-radius: 3px; display: inline-block; margin: 2px 1px; }
    .case-err { background-color: #fff3cd; color: #856404; padding: 2px 4px; border-radius: 3px; display: inline-block; margin: 2px 1px; }
    
    @media (max-width: 600px) {
      .main-container, .results-container { flex-direction: column; }
    }
  </style>
</head>
<body>

  <div class="top-bar">
    <h1>Bombay High Court Clerk Typing</h1>
    <div>Time Left: <strong id="time">10:00</strong></div>
  </div>
  <div class="sub-bar">Section A | Keyboard Layout: QWERTY</div>

  <div class="main-container" id="practiceView">
    <div class="box">
      <textarea id="reference" placeholder="Paste original passage here (paragraph indents and spaces will be preserved)..."></textarea>
    </div>
    <div class="box">
      <textarea id="workspace" placeholder="Start typing here..."></textarea>
    </div>
  </div>

  <div class="footer-bar" id="footerBar">
    <button class="btn btn-cancel" onclick="resetTest()">Cancel</button>
    <div>
      <button class="btn btn-submit" style="background:#28a745;" onclick="startTimer(10)">Start 10M</button>
      <button class="btn btn-submit" onclick="finishTest()">Submit</button>
    </div>
  </div>

  <div class="results-screen" id="resultsView">
    <h2>Typing Performance Evaluation</h2>
    <div class="results-container">
      
      <div class="result-card">
        <div class="card-header-user">Your Typed Paragraph</div>
        <div class="card-body" id="userResultBody"></div>
      </div>

      <div class="result-card">
        <div class="card-header-orig">Original Paragraph</div>
        <div class="card-body" id="origResultBody"></div>
      </div>

    </div>
    <button class="btn btn-submit" style="margin-top:15px; align-self: flex-start;" onclick="goBack()">Back to Test</button>
  </div>

  <script>
    let totalSeconds = 600;
    let timerInterval = null;

    // Preserve Tab keys inside textarea as indents
    document.querySelectorAll('textarea').forEach(textarea => {
      textarea.addEventListener('keydown', function(e) {
        if (e.key === 'Tab') {
          e.preventDefault();
          let start = this.selectionStart;
          let end = this.selectionEnd;
          this.value = this.value.substring(0, start) + "\t" + this.value.substring(end);
          this.selectionStart = this.selectionEnd = start + 1;
        }
      });
    });

    function startTimer(mins) {
      clearInterval(timerInterval);
      totalSeconds = mins * 60;
      timerInterval = setInterval(() => {
        if (totalSeconds > 0) {
          totalSeconds--;
          let m = Math.floor(totalSeconds / 60);
          let s = totalSeconds % 60;
          document.getElementById('time').textContent = `${m.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}`;
        } else {
          clearInterval(timerInterval);
          finishTest();
        }
      }, 1000);
    }

    function renderTokens(text, referenceTokens = null) {
      // Split text into tokens keeping spaces and line breaks intact
      let tokens = text.split(/(\s+)/);
      return tokens;
    }

    function finishTest() {
      clearInterval(timerInterval);
      
      let refText = document.getElementById('reference').value;
      let userText = document.getElementById('workspace').value;

      if (!refText.trim()) {
        alert("Please paste a reference passage on the left first!");
        return;
      }

      let refTokens = renderTokens(refText);
      let userTokens = renderTokens(userText);

      let userHTML = "";
      let origHTML = "";

      let maxLen = Math.max(refTokens.length, userTokens.length);

      for (let i = 0; i < maxLen; i++) {
        let rToken = refTokens[i] || "";
        let uToken = userTokens[i] || "";

        // Preserve spaces and line breaks directly
        if (/^\s+$/.test(rToken) || /^\s+$/.test(uToken)) {
          origHTML += rToken;
          userHTML += uToken;
          continue;
        }

        if (rToken === uToken && rToken !== "") {
          origHTML += `<span class="correct">${rToken}</span>`;
          userHTML += `<span class="correct">${uToken}</span>`;
        } else if (rToken.toLowerCase() === uToken.toLowerCase() && rToken !== "") {
          origHTML += `<span class="case-err">${rToken}</span>`;
          userHTML += `<span class="case-err">${uToken}</span>`;
        } else {
          if (rToken) origHTML += `<span class="wrong">${rToken}</span>`;
          if (uToken) userHTML += `<span class="wrong">${uToken}</span>`;
        }
      }

      document.getElementById('userResultBody').innerHTML = userHTML;
      document.getElementById('origResultBody').innerHTML = origHTML;

      document.getElementById('practiceView').style.display = 'none';
      document.getElementById('footerBar').style.display = 'none';
      document.getElementById('resultsView').style.display = 'flex';
    }

    function goBack() {
      document.getElementById('practiceView').style.display = 'flex';
      document.getElementById('footerBar').style.display = 'flex';
      document.getElementById('resultsView').style.display = 'none';
    }

    function resetTest() {
      clearInterval(timerInterval);
      document.getElementById('workspace').value = '';
      document.getElementById('time').textContent = '10:00';
    }
  </script>
</body>
</html>
